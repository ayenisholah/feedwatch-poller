name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21 commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-llvm-cov,cargo-deny" }
      - name: All gates
        run: ./scripts/check.sh
      - name: Container image builds
        run: docker build -t ci-image .
      - name: Scan full history for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact
