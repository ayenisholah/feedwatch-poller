[package]
name = "feedwatch-poller"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Reads RedStone push feeds over public RPCs, checks freshness and missed updates, writes to InfluxDB"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
