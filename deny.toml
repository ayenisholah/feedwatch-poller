# cargo-deny: licences, advisories and sources. Run with `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # Unmaintained (not a vulnerability), and reached only through testcontainers, a dev-dependency
  # used by the InfluxDB integration tests. It isn't in the shipped binary. Revisit when
  # testcontainers moves off it.
  { id = "RUSTSEC-2026-0440", reason = "dev-only, via testcontainers; not shipped" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
